[package]
name = "nectar_dominion"
version = "0.1.0"
description = "NectarFi x Dominion Market Yield-Backed Prediction Protocol"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "nectar_dominion"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.0", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.0" }