[package]
name = "nectar_dominion"
version = "0.1.0"
description = "NectarFi x Dominion Capital-Efficient Outcome Market"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "nectar_dominion"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token", "token_2022"] }
solana-program = "=1.18.26"