version: '3.8'

services:
  dnye-keeper:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - RESEND_API_KEY=${RESEND_API_KEY}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - KEYPAIR_PATH=/secrets/keeper-keypair.json
    volumes:
      - ./secrets:/secrets:ro
    healthcheck:
      test: ["CMD-SHELL", "node -e 'process.exit(0)'"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"